# Control run: explicit legacy layout, starter_at_origin spawn, no border/
# exterior -- i.e. what every world looked like before Phase 15/16. Compare
# every other file in this set against this one; nothing here should ever
# regress just because spawn-strategy code exists now.
starter:
  biome: 'minecraft:plains'
  radius: 256
layout:
  mode: legacy
spawn:
  strategy: starter_at_origin
