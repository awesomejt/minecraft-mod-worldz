# GOALS 36: a strip world (GOALS 32) whose corridor passes through an
# ordered sequence of biome bands along its length instead of ordinary
# vanilla terrain. This is the Customize-reconstruction companion to config
# 29's config-only fieldless test. **Select "Worldz: Strip World"**, open
# **Customize**, and confirm the screen reconstructs this config's five-block
# absolute width and five configured band biomes. Opening Customize is not
# required to activate bands; this fixture specifically verifies that opening
# and applying it preserves the already-loaded values.
#
# Terrain stays vanilla throughout (TODO 6.3, DESIGN §23): only the BIOME
# changes band to band, never the height/shape -- exactly like chaos_biomes
# (GOALS 33) but ordered along X instead of scattered in a 2D grid.
#
# With bands.width: 128 and five configured biomes, walking along X should
# cross into a new biome roughly every 128 blocks, repeating (wrapping) the
# five-biome sequence once exhausted.
#
# bands.naturalBiomes.rivers/.oceans/.beaches default to true (GOALS 36
# follow-up, Jason 2026-07-19) specifically for bands -- none of the five
# configured biomes are water/beach biomes, so wherever vanilla's own
# terrain would naturally put a river, ocean, beach, or stony shore, that
# should still show through instead of being overridden by the band's land
# biome. This is what an earlier build of this config got wrong: biomes
# were "not all mapping correctly" because natural water/beach features
# never passed through at all.
#
# Steps once in-game:
#  1. In Customize, confirm Corridor width is 5 blocks, Void mode is selected,
#     biome bands are enabled, the five biome ids below are populated in order,
#     and band width is 128. Click Done, then create the world.
#  2. Confirm the corridor's terrain is ordinary vanilla shape (hills,
#     caves, etc.) -- only the biome/surface-block dressing changes.
#  3. Walk along +X from spawn in ~128-block increments; confirm the biome
#     changes each time, following the configured order (desert, jungle,
#     ice_spikes, badlands, taiga, then back to desert).
#  4. Walk along -X from spawn; confirm the same sequence appears in
#     reverse (band index wraps via floor division, so negative X is
#     consistent with positive X, not mirrored oddly).
#  5. Confirm Z is exactly five blocks wide (Z=-2..2), with void immediately
#     outside. The portal target remains Z=0 and may overflow the corridor.
#  6. Look for a natural river, ocean, beach, or stony shore along the
#     corridor (F3 to check biome); confirm it shows through as its real
#     vanilla biome rather than being relabeled to the current band's biome.
overworldBorder:
  enabled: true
  initialRadius: 2048
  finalRadius: 2048
  ensureEndPortal: true
stripWorld:
  enabled: true
  width: 5
  widthMode: void
  spawn:
    strategy: starter_at_origin
  bands:
    enabled: true
    biomes:
      - minecraft:desert
      - minecraft:jungle
      - minecraft:ice_spikes
      - minecraft:badlands
      - minecraft:taiga
    width: 128
    seedRandomOrder: false
