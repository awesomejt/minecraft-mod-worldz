# GOAL 35 (Phase 17.2a/17.2b, DESIGN §34): the stacked-biome-layers
# challenge's core mechanic and Worldz-native default layer stack
# (Jason's own example: plains above desert above taiga).
# **Select "Worldz: Stacked"**.
#
# The underground is replaced entirely by three horizontal bands, each
# reporting its own configured biome, bottom to top: taiga (deepest),
# desert, plains (surface). Real caves are gone -- every layer is its
# own flat/low-relief slab with an air gap above for vegetation to grow
# into.
#
# Steps once in-game:
#  1. Confirm spawn lands on the plains surface (top of the stack) with
#     ordinary daylight -- no caves, no underground start.
#  2. Dig straight down. Confirm you pass through: plains topsoil (stone/
#     dirt/grass) -> an air gap -> desert (sandstone/sand) -> an air gap
#     -> taiga (stone/podzol) -> bedrock at the very bottom. Each band's
#     F3 biome readout should match its own layer, not the surface biome.
#  3. Confirm trees/vegetation generate in *every* layer's own air gap,
#     not just the surface -- podzol/taiga trees in the bottom gap,
#     desert vegetation (dead bushes/cacti, if any) in the middle gap,
#     plains trees/grass/flowers on top. This is GOAL 35's own explicit
#     "trees on every layer" requirement (DESIGN §34.4's buried-layer
#     decoration bypass).
#  4. Confirm ore veins (coal/iron/copper/redstone/gold/diamond/lapis)
#     appear in the bottom (taiga) layer's stone, roughly matching where
#     they'd occur at the same real Y in a normal Overworld -- the
#     bottom layer sits at the dimension's own real min Y (DESIGN
#     §34.4's "real min-Y anchoring satisfies the deep-ore requirement by
#     construction" finding).
#  5. Confirm a stronghold/End portal can still be found and reached
#     (explore or use an eye of ender) -- compare against config 73's
#     deliberately short stack.
stacked:
  layers:
    - "minecraft:taiga;minecraft:bedrock:1,minecraft:stone:40,minecraft:podzol:2;6"
    - "minecraft:desert;minecraft:sandstone:20,minecraft:sand:3;6"
    - "minecraft:plains;minecraft:stone:20,minecraft:dirt:3,minecraft:grass_block:1;0"
overworldBorder:
  enabled: false
  ensureEndPortal: true
