# GOAL 35 (Phase 17.2a/17.2b, DESIGN §34, updated §34.7): the
# stacked-biome-layers challenge's core mechanic and Worldz-native default
# layer stack, now exercising the post-§34.7 defaults: a bounded world
# (worldSizeChunks left at its own default of 4, i.e. a 64-block-radius
# border + VOID exterior), eight layers instead of three, 30-block minimum
# air gaps, gentle per-layer relief instead of dead-flat bands, and a
# thick bottom layer that guarantees the fallback End portal.
# **Select "Worldz: Stacked"**.
#
# The underground is replaced entirely by eight horizontal bands, each
# reporting its own configured biome, bottom to top: taiga (deepest, real
# min Y), desert, badlands, swamp, jungle, savanna, snowy_taiga, plains
# (surface). Every layer's own surface has a small (up to 4 blocks, the
# relief default) bump that varies by column, so bands read as
# gently uneven ground rather than perfectly flat slabs.
#
# Steps once in-game:
#  1. Confirm a world border exists at a 64-block radius (F3 or the
#     pause-menu border indicator) -- this is worldSizeChunks=4's own
#     default, not something this config sets explicitly.
#  2. Confirm spawn lands on the plains surface (top of the stack) with
#     ordinary daylight -- no caves, no underground start.
#  3. Dig straight down. Confirm you pass through all eight bands in
#     order (taiga at the very bottom) separated by roughly 30-block air
#     gaps, and that each band's F3 biome readout matches its own layer,
#     not the surface biome.
#  4. Confirm each layer's own surface is gently uneven from column to
#     column (small bumps/dips, not a perfectly flat plane) -- this is
#     DESIGN §34.7's relief bump. Confirm trees/vegetation still generate
#     correctly in the bumped terrain, not floating or buried.
#  5. Confirm trees/vegetation generate in *every* layer's own air gap,
#     not just the surface (GOAL 35's own explicit "trees on every layer"
#     requirement, DESIGN §34.4's buried-layer decoration bypass).
#  6. Confirm ore veins (coal/iron/copper/redstone/gold/diamond/lapis)
#     appear in the bottom (taiga) layer's thick stone, roughly matching
#     where they'd occur at the same real Y in a normal Overworld -- the
#     bottom layer sits at the dimension's own real min Y.
#  7. Locate the End portal. At this default 64-block radius, DESIGN
#     §34.7 predicts the fallback vault (not a natural stronghold --
#     NATURAL_STRUCTURE_MARGIN=128 is bigger than the border, so a
#     natural stronghold is always rejected) landing inside the bottom
#     layer's stone near Y -32. Confirm this is what you find, not a
#     surprise.
stacked:
  layers:
    - "minecraft:taiga;minecraft:bedrock:1,minecraft:stone:43;30"
    - "minecraft:desert;minecraft:sandstone:7,minecraft:sand:3;30"
    - "minecraft:badlands;minecraft:stone:4,minecraft:terracotta:5,minecraft:red_sand:1;30"
    - "minecraft:swamp;minecraft:stone:5,minecraft:mud:4,minecraft:grass_block:1;30"
    - "minecraft:jungle;minecraft:stone:5,minecraft:dirt:4,minecraft:grass_block:1;30"
    - "minecraft:savanna;minecraft:stone:5,minecraft:coarse_dirt:4,minecraft:grass_block:1;30"
    - "minecraft:snowy_taiga;minecraft:stone:5,minecraft:dirt:3,minecraft:podzol:1,minecraft:snow_block:1;30"
    - "minecraft:plains;minecraft:stone:6,minecraft:dirt:3,minecraft:grass_block:1;0"
# No explicit overworldBorder/overworldExterior here on purpose -- DESIGN
# §34.7's worldSizeChunks default (4) derives a 64-block-radius border
# (with ensureObjective always true) and a VOID exterior on its own.
