# GOAL 15 (Phase 16.2a, DESIGN §33.2): the classic flat challenge's core
# mechanic and Worldz-native default layer stack. **Select "Worldz: Flat"**.
#
# Unlike vanilla's own classic_flat preset (bedrock+2 dirt+grass, only 4
# blocks tall -- which lands at the very bottom of the modern -64..320
# build range, a real vanilla quirk never rebalanced after the 1.18
# height change), Worldz's own default reaches a comfortable Y 64
# surface (bedrock + 123 stone + 3 dirt + grass = 128 total, starting at
# Y -64) -- naturally above the Y-40 slime-spawn cutoff too.
#
# Steps once in-game:
#  1. Confirm the world is completely flat -- no hills, no mountains,
#     everywhere, and the surface sits at Y 64 (check F3).
#  2. Confirm there are NO caves anywhere -- classic flat has zero
#     noise/carving of any kind, matching vanilla's own real superflat.
#  3. Confirm the biome is plains everywhere (the configured default).
#  4. Confirm villages and strongholds (the default structureOverrides
#     list) can still generate -- locate a stronghold with an eye of
#     ender or explore for a village.
#  5. Confirm world generation itself feels fast/lightweight, closer to
#     vanilla superflat's own performance than a real terrain preset --
#     this preset deliberately never runs the delegate's real noise
#     generation at all (DESIGN §33.1).
flat:
  layers:
    - "minecraft:bedrock:1"
    - "minecraft:stone:123"
    - "minecraft:dirt:3"
    - "minecraft:grass_block:1"
  biome: minecraft:plains
overworldBorder:
  enabled: false
  ensureEndPortal: true
