# GOALS 09 (Phase 12.2): the top-only depth cutoff (DESIGN §29.3), the
# "like 5 deep to ensure access to stone" option.
# **Select "Worldz: Sky Chunk"** on the creation screen.
#
# The starter chunk keeps only its top 5 blocks below the real generated
# surface; everything deeper is void. This is a real per-column cutoff
# measured from each column's own natural surface height, not a flat
# world-absolute Y -- a hilly starter chunk should show a correspondingly
# uneven void ceiling underneath, following the terrain shape.
#
# Steps once in-game:
#  1. Confirm you spawn on the starter island with completely normal-looking
#     surface terrain (grass, trees, etc., same as any vanilla chunk).
#  2. Dig straight down from several different points on the island. Count
#     blocks: after roughly 5 blocks below the surface at that exact column,
#     confirm you break through into void, not more stone.
#  3. If the starter chunk has any height variation, confirm the void
#     ceiling underneath follows the surface shape (deeper surface point =
#     deeper void start), not a single flat cutoff Y for the whole chunk.
#  4. Confirm any structures/decoration cut off cleanly at the void boundary
#     (e.g. a tree with roots but no trunk below the cutoff) -- this is an
#     accepted, documented cross-section artifact per DESIGN §29.3, not a
#     defect to report.
chunkIsland:
  enabled: true
  spawnChance: 0.1
  cellSizeChunks: 1
  topOnly: true
  topOnlyDepthBlocks: 5
  exclusionZoneEnabled: true
  exclusionZoneRadiusBlocks: 256
overworldBorder:
  enabled: false
  ensureEndPortal: true
