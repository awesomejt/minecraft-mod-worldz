# GOALS 20: collapsing world -- starts large, holds there for a much longer
# delay than the expanding case (21) to allow exploration first, then
# shrinks continuously down to a minimum size. Spawn stays at the center
# (`starter_at_origin`), so a build there is always safe even after the
# border fully collapses. See config 21's note for the 26.2 time-skipping
# commands: `/time add <Nd>` to burn through the delay, `/tick step` to
# watch the border actually move.
#
# Requires 0.2.12+ (see config 21's note) -- earlier versions never
# actually started the collapse either.
#
# This file's resize.delayDays/resize.days (10 and 40): ten full days to
# explore, then the border creeps from 2048 down to 256 over 40 days,
# roughly 45 radius-blocks per day. Steps once in-game (adjust tick
# counts if you change the values above):
#  1. Confirm the border starts at 2048 (radius) and does not move yet.
#  2. `/time add 10d` (or `/tick step 240000`) -- the deliberately long
#     delay (GOALS 20) expires; the collapse should begin within a second
#     or two.
#  3. `/tick step 24000` (1 day) -- confirm the border is ~45 blocks
#     smaller, shrinking smoothly rather than jumping. Repeat to taste.
#  4. To fast-forward, `/tick step` the remainder in big chunks (40 days
#     total = 960000 ticks) -- confirm it stops at exactly 256 (its
#     configured minimum) and never goes below.
#  5. Confirm spawn (and anything built there) is still safely inside the
#     collapsed border.
layout:
  mode: legacy
overworldBorder:
  enabled: true
  initialRadius: 2048
  finalRadius: 256
  resize:
    delayDays: 10
    days: 40
  ensureEndPortal: true
spawn:
  strategy: starter_at_origin
