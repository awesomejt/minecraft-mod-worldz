# GOALS 33: same as 16, but a small regionScale (64, near the
# supported minimum of 16) -- biome regions should change noticeably more
# often when walking/flying across the world than the default config.
chaosBiomes:
  biomes:
    - 'minecraft:desert'
    - 'minecraft:jungle'
    - 'minecraft:ice_spikes'
    - 'minecraft:badlands'
    - 'minecraft:taiga'
  regionScale: 64
  starter:
    biome: ''
    radius: 128
  spawn:
    strategy: starter_at_origin
  naturalBiomes:
    rivers: true
    oceans: true
