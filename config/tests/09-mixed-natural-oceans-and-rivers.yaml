# Natural-looking terrain WITH real oceans preserved (unlike 08, which
# removes big oceans by design). layout.mode: mixed classifies every column
# into a land, ocean, or beach role from a seeded grid and raises/lowers
# terrain to match, so ocean biomes generate genuine lowered ocean and land
# biomes generate genuine raised land -- the biome label and the terrain
# height always agree, which is exactly what legacy mode (see 01's result)
# does not guarantee.
#
# Deliberately does NOT include `river` in layout.biomes: mixed assigns ONE
# biome to an entire region cell (up to 512x512 blocks), so `river` there
# means a whole flat/hilly land-height area gets labeled and colored River
# with no actual channel -- confirmed in-game on world "Worldz14" (an
# isolated land cell surrounded by ocean rendered as a normal round island,
# HUD biome "River", no winding water anywhere). Natural-looking rivers and
# ponds already appear inside land cells on their own, from vanilla's own
# terrain noise -- the height math only raises columns that are too low, it
# never flattens natural dips -- so `river` in layout.biomes adds no benefit,
# only this failure mode. Kept in allowedBiomes since that's unaffected
# (non-legacy layout modes resolve biomes from worldLayoutPlan, not the
# climate-filtered allowedBiomes list).
starterBiome: 'minecraft:plains'
starterRadiusBlocks: 256
allowedBiomes:
  - 'minecraft:plains'
  - 'minecraft:forest'
  - 'minecraft:river'
  - 'minecraft:beach'
  - 'minecraft:ocean'
  - 'minecraft:deep_ocean'
layout:
  mode: mixed
  biomes:
    - 'minecraft:plains@3'
    - 'minecraft:forest@2'
    - 'minecraft:beach'
    - 'minecraft:ocean@2'
    - 'minecraft:deep_ocean'
  oceanCoverageFraction: 0.35
spawn:
  strategy: starter_at_origin
