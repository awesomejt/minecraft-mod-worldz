# GOALS 27/41 (Phase 14.2a + 14b, DESIGN §31.4/§31.9): the guaranteed
# capsule/starter-base as the *automatic default* for a low `spawnY`
# (Jason, 2026-07-26: "using the capsule should be the default behavior
# in cases like [this config]... spawn low in the world with rare access
# to caves") -- `spawnY: 4` is close enough to the Nether's own Y-0
# bedrock floor that the natural safe-site search is skipped entirely,
# with no `forceCapsule` needed. **Select "Worldz: Nether Start"**.
#
# Steps once in-game:
#  1. Check the server log at world creation: it should say spawnY is
#     close to the floor/ceiling and the capsule is being built directly
#     -- the natural-pocket search should never have run at all.
#  2. Confirm you spawn inside a decent-sized, fully enclosed nether-brick
#     room (default 7x7x5 exterior, so a 5x5x3 interior as seen from
#     inside -- floor, ceiling, and all four walls solid, not just corner
#     posts), lit by one glowstone block centered on each of the north/
#     east/west walls (the south wall is the furniture wall, see step 3).
#     Confirm there's no way to fall into surrounding lava/void from
#     inside it -- it's genuinely sealed.
#  3. Confirm the chest (easy tier: 10 obsidian, 1 flint and steel, bread,
#     a wooden pickaxe, plus random extras), a furnace, and a crafting
#     table all line the south wall together, centered -- chest in the
#     middle, furnace and crafting table on either side -- not the chest
#     alone underfoot with no room to move.
#  4. Confirm the capsule doesn't overwrite anything unexpected outside
#     its own footprint.
netherStart:
  spawnY: 4
  chestTier: easy
overworldBorder:
  enabled: false
  ensureEndPortal: true
