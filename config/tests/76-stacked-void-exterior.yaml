# GOAL 35/17 (DESIGN §34.7): stacked's own bounded-world default combo --
# a 64-block-radius Overworld border with a VOID exterior beyond it -- made
# explicit here and actually verified, not just implied by config 72
# (whose own step 1 only confirms the border *indicator* exists, never
# what's actually beyond it). **Select "Worldz: Stacked"**. Same eight-
# layer stack as config 72; only the border/exterior are spelled out
# explicitly instead of left to DESIGN §34.7's own derivation, so this
# config's whole point -- the void itself -- can't be missed or skipped.
#
# Steps once in-game:
#  1. Confirm a world border exists at a 64-block radius (F3 or the
#     pause-menu border indicator), same as config 72.
#  2. Walk or fly toward the border until the vanilla invisible-wall
#     effect stops you -- confirm you're actually blocked right at the
#     64-block radius, not noticeably before or after it.
#  3. Ascend above the stack's own topmost (plains) surface near the
#     border, then look/fly out past the border's edge. Confirm real void
#     beyond it (open black nothing, no terrain, no fallback biome) -- not
#     vanilla terrain continuing, and not just a fog/wall illusion hiding
#     real terrain underneath.
#  4. From high up, look straight down just past the border's outer edge.
#     Confirm the void extends the full build-height column -- no floor, no
#     exterior terrain profile of any kind, all the way down.
#  5. Confirm everything else matches config 72 otherwise: eight bands,
#     30-block gaps, spawn on the plains surface, fallback End portal near
#     the bottom layer's Y -32.
stacked:
  layers:
    - "minecraft:taiga;minecraft:bedrock:1,minecraft:stone:43;30"
    - "minecraft:desert;minecraft:sandstone:7,minecraft:sand:3;30"
    - "minecraft:badlands;minecraft:stone:4,minecraft:terracotta:5,minecraft:red_sand:1;30"
    - "minecraft:swamp;minecraft:stone:5,minecraft:mud:4,minecraft:grass_block:1;30"
    - "minecraft:jungle;minecraft:stone:5,minecraft:dirt:4,minecraft:grass_block:1;30"
    - "minecraft:savanna;minecraft:stone:5,minecraft:coarse_dirt:4,minecraft:grass_block:1;30"
    - "minecraft:snowy_taiga;minecraft:stone:5,minecraft:dirt:3,minecraft:podzol:1,minecraft:snow_block:1;30"
    - "minecraft:plains;minecraft:stone:6,minecraft:dirt:3,minecraft:grass_block:1;0"
overworldBorder:
  enabled: true
  initialRadiusBlocks: 64
  finalRadiusBlocks: 64
  ensureEndPortal: true
overworldExterior:
  mode: void
