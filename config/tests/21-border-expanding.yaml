# GOALS 19: expanding world -- starts at a small radius, holds there for an
# initial delay, then grows continuously at a configured rate. Use an
# operator's `/tick step <ticks>` (1 Minecraft day = 24000 ticks) to skip
# through the delay and resize period quickly instead of waiting in real
# time -- `/time set`/`/time add` only change the daylight cycle, not the
# per-dimension elapsed-tick counter the border schedule actually runs on.
#
# Requires 0.2.12+: earlier versions compared the delay against the wrong
# clock (ServerLevel.getGameTime(), which 26.2 no longer keeps in sync with
# real play time) and the border would never actually start expanding no
# matter how long you waited or stepped -- see TODO.md's 2026-07-18
# Deviation log entry. Delete any world created with an older jar and
# start fresh; its stuck state isn't fixable in place.
#
# This file's own resizeDelayDays/resizeDays (5 and 1) mean a full test is
# 6 in-game days = 144000 ticks total. Steps once in-game:
#  1. Confirm the border starts at 64 (radius, clamped up from
#     initialRadiusBlocks: 16) and does not move yet.
#  2. `/tick step 120000` (5 days) -- confirm it still hasn't started
#     (resizeDelayDays: 5).
#  3. `/tick step 12000` (half a day) -- confirm the border has now grown
#     partway toward 1024, continuing smoothly rather than jumping.
#  4. `/tick step 12000` again -- confirm it has reached exactly 1024 and
#     stops there.
layout:
  mode: legacy
overworldBorder:
  enabled: true
  initialRadiusBlocks: 16
  finalRadiusBlocks: 1024
  resizeDelayDays: 5
  resizeDays: 1
  ensureEndPortal: true
spawn:
  strategy: starter_at_origin
