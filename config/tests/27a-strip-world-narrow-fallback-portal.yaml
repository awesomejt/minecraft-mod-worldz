# GOALS 32: a deliberately narrow strip specifically exercising the
# fallback-portal fix found during Phase 6.1's design spike. **Select
# "Worldz: Strip World"** on the creation screen.
#
# Before the fix, the compact fallback End portal's Z-candidate search
# (`{0, 64, -64, 128, -128}`) used the SAME radius for both axes -- so with
# a corridor this narrow (width: 13, spanning Z=-6..6), a candidate like Z=64
# would have been wrongly accepted (it fits the border's own 128-block
# radius) and the portal placed in the void well outside the corridor.
# `ObjectiveSite.narrowForStrip` now clamps the Z bound to the strip's own
# width, so only Z=0 can ever be chosen here.
#
# Small border radius (128) makes a natural stronghold unlikely to fit, so
# the compact fallback portal should always be the one built -- exactly
# the path that exercises this fix.
#
# Steps once in-game:
#  1. Confirm the corridor is exactly 13 blocks wide (Z=-6..6).
#  2. Confirm a compact fallback End portal was built, and it sits INSIDE
#     the corridor (roughly Z=0, not Z=64/-64/128/-128 -- check its
#     center targets Z=0; the room itself may overflow the narrow corridor).
#  3. Confirm the dragon fight is normal and winnable.
stripWorld:
  enabled: true
  width: 13
  widthMode: void
  spawn:
    strategy: starter_at_origin
overworldBorder:
  enabled: true
  initialRadius: 128
  finalRadius: 128
  ensureEndPortal: true
