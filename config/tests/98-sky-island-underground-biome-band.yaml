# GOAL 42 (Phase 21.4b, DESIGN §37.3): sky island's own synthetic
# underground biome band -- same idea as config 97's flat field, applied
# to the floating island's own thin slab. **Select "Worldz: Sky
# Island"**.
#
# IMPORTANT: config-only for now (not yet on the Customize screen) --
# select "Worldz: Sky Island" and click **Create World directly**,
# without opening Customize and clicking "Done" (same caveat as config
# 96 -- Customize would persist a hardcoded disabled band instead).
#
# `thicknessBlocks: 6` (the default) means solid ground spans Y 58-63
# (`surfaceY` 64 minus 6 blocks); `undergroundBelowSurfaceBlocks: 3`
# (deliberately smaller than the default `10` used in config 97) puts
# the boundary at Y 61, so the underground band -- Y 58-60, 3 blocks --
# falls *within* the slab's own diggable ground rather than in the void
# beneath it. See README's own note on this interaction: with the
# default `undergroundBelowSurfaceBlocks: 10`, the band would start
# below the slab entirely, in unreachable void.
#
# Steps once in-game:
#  1. Confirm the island's surface (Y 64) reads as `plains` (F3).
#  2. Dig straight down through the slab. Confirm the biome reading
#     switches to `dripstone_caves` at Y 60, and stays that way through
#     Y 58 (the bottom of the solid slab).
#  3. Confirm digging one block further (Y 57) drops you into the void
#     beneath the island, as normal.
skyIsland:
  islandBiome: minecraft:plains
  radiusBlocks: 16
  surfaceY: 64
  thicknessBlocks: 6
  undergroundBiome: minecraft:dripstone_caves
  undergroundBelowSurfaceBlocks: 3
