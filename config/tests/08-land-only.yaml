# Guarantees land nearly everywhere: raises only columns that are clearly
# deep ocean, leaving shallow natural depressions (rivers, ponds) alone.
# Fixes the "ocean mapped as river" mismatch seen with 01 -- that was
# layout.mode: legacy (the default), which only filters climate and never
# reconciles the chosen biome with actual terrain height, so an allowed
# biome with no real ocean option nearby (river was the closest climate
# match in the default allowedBiomes list) can get reported directly over
# genuine vanilla ocean. land_only instead decides biome and height
# together, so no water this deep should remain unless it's a natural
# river/pond.
starterBiome: 'minecraft:plains'
starterRadiusBlocks: 256
allowedBiomes:
  - 'minecraft:plains'
  - 'minecraft:forest'
  - 'minecraft:desert'
  - 'minecraft:river'
  - 'minecraft:beach'
layout:
  mode: land_only
  biomes:
    - 'minecraft:plains@3'
    - 'minecraft:forest@2'
    - 'minecraft:desert'
    - 'minecraft:river'
    - 'minecraft:beach'
spawn:
  strategy: starter_at_origin
