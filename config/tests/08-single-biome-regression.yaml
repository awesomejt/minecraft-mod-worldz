# Regression check for SINGLE_BIOME mode after the 2026-07-16 MIXED/LAND_ONLY
# removal (TODO 1.2) and the real-seed sampling change (TODO 1.3) -- confirms
# this surviving mode still works: one biome fills the world, terrain raised
# or capped to match its role, same seed reproduces the same world.
starter:
  biome: 'minecraft:plains'
  radius: 256
layout:
  mode: single_biome
  singleBiome: 'minecraft:desert'
spawn:
  strategy: starter_at_origin
