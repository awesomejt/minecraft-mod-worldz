# Combines a found preferred-natural-biome origin with border, exterior,
# and a non-legacy layout, all enabled together. The single most important
# check in this whole set: border, exterior, and layout must all recenter
# on the FOUND origin, not stay at (0,0).
#
# Steps once in-game:
#  1. Note the origin (spawn coordinates minus the ~(8,8) spawn offset).
#  2. Walk toward (0,0) -- the border should NOT be there.
#  3. Walk to the border edge in each direction -- it should be
#     `overworldBorder.initialRadiusBlocks` (1024) from the FOUND origin.
#  4. Beyond the exterior boundary, terrain should turn to ocean, again
#     measured from the found origin, not (0,0).
#  5. /locate structure minecraft:stronghold (or explore) -- the End portal
#     guarantee should be reachable inside the recentered border.
starterBiome: 'minecraft:plains'
starterRadiusBlocks: 256
overworldBorder:
  enabled: true
  initialRadiusBlocks: 1024
  finalRadiusBlocks: 1024
  ensureEndPortal: true
overworldExterior:
  mode: ocean
  oceanTransitionWidthBlocks: 128
layout:
  mode: mixed
  biomes:
    - 'minecraft:plains@3'
    - 'minecraft:desert'
    - 'minecraft:ocean'
    - 'minecraft:beach'
  oceanCoverageFraction: 0.35
spawn:
  strategy: preferred_natural_biome
