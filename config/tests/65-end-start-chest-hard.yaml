# GOALS 34 (Phase 15.2b, DESIGN §32.5): the End-start challenge's hard
# chest tier. **Select "Worldz: End Start"**.
#
# Steps once in-game:
#  1. Confirm the chest holds only 2 bread plus 1 random extra (arrows or
#     an ender pearl) -- no rockets, no guaranteed weapon at all.
#  2. Confirm the platform's own end stone is still minable by hand (no
#     tool required, just slow) -- this is the tier's only guaranteed
#     path to beatability (DESIGN §32.2/§32.5), so it must always work.
#  3. Report back whether the "mine and bridge by hand, no weapon, no
#     rockets" path felt like a long grind (expected) or genuinely
#     unreasonable -- DESIGN §32.5 flags this as a first pass, not signed
#     off, and names shortening the platform distance or adding a small
#     guaranteed nudge (e.g. a pickaxe) as the likely fix if so.
endStart:
  chestTier: hard
overworldBorder:
  enabled: false
  ensureEndPortal: true
