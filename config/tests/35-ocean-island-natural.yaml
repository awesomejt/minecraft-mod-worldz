# GOALS 02: a natural island found in the seed's own unmodified terrain
# (DESIGN §25.4, TODO 8.2). **Select "Worldz: Ocean Island"** and, if
# opening Customize, choose "Natural (found in the seed)" for Island
# source -- this file sets it directly via `oceanIsland.islandSource:
# natural`.
#
# Unlike the artificial island (config 30), nothing about the land is
# synthesized: `IslandPlan.syntheticLand` is false, so there is no
# interior biome override, no shore ring, and no terrain raise -- the
# real seed's own biome and terrain show through completely unmodified
# within `radiusBlocks` of wherever the search finds an isolated
# landmass. Beyond that radius, the same ocean gradient as every other
# ocean_island source applies.
#
# radiusBlocks is smaller than the artificial default (48, not 128) --
# real terrain features are usually smaller-scale than a large synthetic
# island, so a tighter search radius is more likely to actually find a
# qualifying isolated landmass within the search range.
#
# **This search is not guaranteed to succeed on every seed** (DESIGN
# §25.6 -- explicitly time-boxed, unvalidated against real seeds yet). If
# the log shows "Natural island search found no isolated land... using
# the origin instead", that is the documented fallback working as
# designed, not a bug -- try a few different world seeds if you want to
# see the search actually succeed. Check the log either way for exactly
# which happened.
#
# Steps once in-game:
#  1. Check the log for either "Natural island search found..." (search
#     succeeded, note the coordinates) or the "...using the origin
#     instead" fallback warning.
#  2. If the search succeeded: confirm the land within ~48 blocks of
#     spawn looks like ordinary, unmodified vanilla terrain (varied
#     biomes/elevation, not a single flattened biome or a raised
#     platform) with real ocean beginning at the edge of that radius.
#  3. Confirm the ocean gradient beyond the island still reads shallow
#     near the coastline, deepening further out.
#  4. Confirm a compact, buried, enclosed fallback End portal exists
#     somewhere reachable and the dragon fight is winnable.
#  5. Confirm the Nether is completely ordinary, unrestricted vanilla
#     Nether generation.
oceanIsland:
  islandSource: natural
  radiusBlocks: 48
overworldBorder:
  enabled: false
  ensureEndPortal: true
