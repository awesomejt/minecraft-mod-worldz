# GOALS 27 (TODO 15.2a-bugfix cleanup, 2026-07-26): real in-game proof
# that `netherStart.chest.kits.<tier>` YAML overrides actually take effect
# (`netherStart.<tier>Kit` before TODO 25.6e's key restructure).
# TODO 15.2a-bugfix logged this as a real defect ("any of Jason's own
# `netherStart.easyKit`/etc. YAML customizations are silently ignored")
# but turned out to already be fixed as an incidental fix in commit
# `427f699` (0.3.2) -- the checklist line was simply never closed. This
# config is the missing real-world check: a custom `chest.kits.hard` with
# obviously-not-default contents, so a silently-ignored override would
# be unmistakable (you'd see the built-in hard defaults -- 2 bread, a
# wooden pickaxe, one random extra from gold ingots/torches -- instead).
# **Select "Worldz: Nether Start"**.
#
# Steps once in-game:
#  1. Confirm you spawn safely in the Nether as usual (see config 59 for
#     the general safety/respawn checks -- not repeated here).
#  2. Confirm the chest holds *exactly* this config's own override: 5
#     diamonds, 3 emeralds, 2 bread as essentials, plus 1 golden apple
#     (the only configured extra). If you instead see the built-in hard
#     tier (2 bread, a wooden pickaxe, one random gold ingot/torch
#     extra), the config plumbing regressed -- report back immediately.
#  3. No pickaxe is guaranteed by this override on purpose (the built-in
#     hard tier's own wooden pickaxe was deliberately dropped from
#     `essentials` below) -- confirm you can still reach real netherrack
#     to mine with whatever the extras/exploration provide, same
#     "genuinely beatable from a minimal start" spirit as config 61.
netherStart:
  spawnY: 32
  chest:
    tier: hard
    kits:
      hard:
        essentials:
          - "minecraft:diamond:5"
          - "minecraft:emerald:3"
          - "minecraft:bread:2"
        extras:
          - "minecraft:golden_apple:1"
        extrasCount: 1
overworldBorder:
  enabled: false
  ensureEndPortal: true
