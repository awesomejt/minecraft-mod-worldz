# GOALS 33's "option to keep natural rivers/oceans where vanilla put them",
# reusing the same Phase 3.1 vanilla pass-through mechanism as
# singleBiome's allowRivers/allowOceans -- confirms it generalizes
# correctly to chaos_biomes too. Also exercises the optional starter zone
# (a safe plains patch at spawn instead of chaos starting immediately),
# since 16-18 all leave it disabled.
chaosBiomes:
  biomes:
    - 'minecraft:desert'
    - 'minecraft:jungle'
    - 'minecraft:ice_spikes'
    - 'minecraft:badlands'
    - 'minecraft:taiga'
  regionScaleBlocks: 512
  starterBiome: 'minecraft:plains'
  starterRadiusBlocks: 256
  spawn:
    strategy: starter_at_origin
  allowRivers: true
  allowOceans: true
