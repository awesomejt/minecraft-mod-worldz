# GOALS 33: same as 16, but a large regionScaleBlocks (4096, near the
# supported maximum of 8192) -- expect long, uninterrupted stretches of one
# biome, changing only after traveling very far.
chaosBiomes:
  biomes:
    - 'minecraft:desert'
    - 'minecraft:jungle'
    - 'minecraft:ice_spikes'
    - 'minecraft:badlands'
    - 'minecraft:taiga'
  regionScaleBlocks: 4096
  starterBiome: ''
  starterRadiusBlocks: 256
  spawn:
    strategy: starter_at_origin
  allowRivers: true
  allowOceans: true
