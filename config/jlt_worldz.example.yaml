# Documented reference for config/jlt_worldz.yaml. This file is never read or
# written by the mod -- copy the settings you want into your own
# jlt_worldz.yaml (create it if it doesn't exist; an absent file means all
# defaults apply). See README.md for how the mod-level file relates to
# per-world settings chosen in the Customize screen.

# Biome ids and/or #tag ids allowed in newly created Worldz overworlds.
# Default: a desert/badlands/cave biome mix with a plains starter.
allowedBiomes:
  - 'minecraft:desert'
  - 'minecraft:beach'
  - 'minecraft:river'
  - 'minecraft:badlands'
  - 'minecraft:eroded_badlands'
  - 'minecraft:wooded_badlands'
  - 'minecraft:stony_shore'
  - 'minecraft:dripstone_caves'
  - 'minecraft:lush_caves'
  - 'minecraft:deep_dark'

# Biome id forced around origin in newly created worlds. Default:
# minecraft:plains. Empty disables the starter zone. Tags are not accepted.
starterBiome: 'minecraft:plains'

# Circular starter-zone radius in blocks. Default: 256. Range: 64..4096.
starterRadiusBlocks: 256

# Raise insufficient natural terrain beneath a selected starter biome.
# Default: true; no effect without a starter biome.
ensureStarterLand: true

# Smooth outward blend from guaranteed starter land to natural terrain.
# Default: 128. Range: 0..4096.
starterLandTransitionBlocks: 128

# Solid repair depth below the natural ocean floor. Default: 48. Range: 0..384.
starterLandFoundationDepthBlocks: 48

# Optional square border centered at 0,0. Radius is center-to-side distance;
# resizeDelayDays waits at the initial radius. End portal is reachable by
# the final size when enabled.
overworldBorder:
  enabled: false
  initialRadiusBlocks: 512
  finalRadiusBlocks: 512
  resizeDays: 0
  resizeDelayDays: 0
  resizeRateBlocks: 0
  resizeRateDays: 0
  ensureEndPortal: true

# Optional independent Nether border; resizeDelayDays waits at the initial
# radius. Blaze access is reachable by the final size when enabled.
netherBorder:
  enabled: false
  initialRadiusBlocks: 512
  finalRadiusBlocks: 512
  resizeDays: 0
  resizeDelayDays: 0
  resizeRateBlocks: 0
  resizeRateDays: 0
  ensureBlazeAccess: true

# Option to carry the Overworld's eventual (final) border radius into the
# End (GOALS 17), clamped up to minimumRadiusBlocks so the dragon fight
# stays winnable even at very small Overworld sizes. Only takes effect
# when the Overworld border above is enabled; the End otherwise stays
# completely vanilla and unbordered.
endBorder:
  carryFromOverworld: false
  minimumRadiusBlocks: 256

# Terrain beyond a central square: normal, ocean, or void. Boundary 0
# derives from an enabled border.
overworldExterior:
  mode: normal
  boundaryRadiusBlocks: 0
  oceanTransitionWidthBlocks: 128

# Nether terrain beyond a central square: normal or void. Boundary 0
# derives from an enabled border.
netherExterior:
  mode: normal
  boundaryRadiusBlocks: 0
  oceanTransitionWidthBlocks: 128

# Coordinated terrain layout: mode (legacy/ocean/single_biome/void/chaos),
# weighted biomes list (id or id@weight, roles resolved via maintained
# defaults plus roleOverrides), regionScaleBlocks, singleBiome. Default:
# legacy (today's climate-filter-only behavior).
layout:
  mode: legacy
  biomes: []
  regionScaleBlocks: 512
  singleBiome: ''
  roleOverrides: {}

# Vanilla river/ocean pass-through for the generic Worldz preset's own
# single_biome/chaos layout modes above (the dedicated singleBiome:/
# chaosBiomes: typed presets below have their own copies of these two
# settings instead). Default: both false. See singleBiome: below for what
# they do.
allowRivers: false
allowOceans: false

# How the layout origin and initial spawn are chosen: strategy is
# starter_at_origin (default, today's behavior), preferred_natural_biome
# (search near the origin for starterBiome using the real seed, moving the
# layout origin there; falls back to starter_at_origin if not found or
# starterBiome is empty), or vanilla_spawn (unmodified vanilla spawn
# selection).
spawn:
  strategy: starter_at_origin

# Defaults for the jlt_worldz:single_biome typed preset (its own small
# Customize screen, separate from the fields above). landBiome fills the
# whole world; starterBiome empty means no forced zone (same as landBiome
# everywhere already, via layout mode single_biome); starterRadiusBlocks
# only matters when starterBiome is set; spawn.strategy accepts the same
# values as the shared spawn section above (preferred_natural_biome
# searches for starterBiome using the real seed). allowRivers/allowOceans
# let vanilla's own river/ocean biomes generate naturally wherever vanilla
# would place one, instead of the single biome applying everywhere;
# allowOceans is additive over allowRivers (both stay on together).
# Terrain is untouched either way -- coastlines/channels are exactly
# vanilla's, outside the guaranteed-land starter zone.
singleBiome:
  landBiome: 'minecraft:plains'
  starterBiome: ''
  starterRadiusBlocks: 256
  spawn:
    strategy: starter_at_origin
  allowRivers: false
  allowOceans: false

# Defaults for the jlt_worldz:chaos_biomes typed preset (GOALS 33; its own
# small Customize screen). biomes is a weighted list (id or id@weight) of
# land biomes shuffled per region -- deserts beside ice spikes beside
# jungles; regionScaleBlocks controls how big each region is (smaller means
# more frequent biome changes). starterBiome empty means chaos starts right
# at spawn; setting one gives a safe, guaranteed-land starting patch like
# singleBiome's. Terrain is always exactly vanilla -- this only ever
# changes biome identity, never height. allowRivers/allowOceans work
# exactly like singleBiome's.
chaosBiomes:
  biomes:
    - 'minecraft:desert'
    - 'minecraft:jungle'
    - 'minecraft:ice_spikes'
    - 'minecraft:badlands'
    - 'minecraft:taiga'
  regionScaleBlocks: 512
  starterBiome: ''
  starterRadiusBlocks: 256
  spawn:
    strategy: starter_at_origin
  allowRivers: false
  allowOceans: false

# World-hazard "forever night" module (GOAL 30, DESIGN §35.1) -- a shared
# runtime rule, not a typed preset, composable with any world type.
# lockAfterDays: 0 locks night immediately at world creation; a positive
# value keeps normal day/night until that many in-game days have passed,
# then locks. Once locked, vanilla's own sleep-skip logic already refuses
# to advance time (verified against the real 26.2 source), so sleeping
# cannot un-lock it. relaxInsomnia: false keeps vanilla phantom rules
# (sleeping still resets a player's own insomnia timer even though it
# won't skip time); true actively suppresses phantoms for players who
# don't want to deal with them in a night that never ends. Known
# limitation: locking night also pauses any active overworldBorder resize
# schedule for as long as it stays locked (26.2 ties both to the same
# per-dimension clock) -- see README.
foreverNight:
  enabled: false
  lockAfterDays: 0
  relaxInsomnia: false
