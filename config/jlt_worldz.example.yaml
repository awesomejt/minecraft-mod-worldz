# Documented reference for config/jlt_worldz.yaml. This file is never read or
# written by the mod -- copy the settings you want into your own
# jlt_worldz.yaml (create it if it doesn't exist; an absent file means all
# defaults apply). See README.md for how the mod-level file relates to
# per-world settings chosen in the Customize screen.

# Biome ids and/or #tag ids allowed in newly created Worldz overworlds.
# Default: a desert/badlands/cave biome mix with a plains starter.
allowedBiomes:
  - 'minecraft:desert'
  - 'minecraft:beach'
  - 'minecraft:river'
  - 'minecraft:badlands'
  - 'minecraft:eroded_badlands'
  - 'minecraft:wooded_badlands'
  - 'minecraft:stony_shore'
  - 'minecraft:dripstone_caves'
  - 'minecraft:lush_caves'
  - 'minecraft:deep_dark'
  - 'minecraft:sulfur_caves'

# Biome forced around origin in newly created worlds, and whether/how low
# terrain beneath it is reinforced into usable land. biome empty disables
# the starter zone; tags are not accepted. radius is the circular starter-
# zone radius in blocks (default 256, range 64..4096). land.enabled raises
# insufficient natural terrain beneath a selected starter biome (default
# true; no effect without a starter biome); land.transition smooths the
# outward blend from guaranteed starter land to natural terrain (default
# 128, range 0..4096); land.foundationDepth is the solid repair depth below
# the natural ocean floor (default 48, range 0..384).
starter:
  biome: 'minecraft:plains'
  radius: 256
  land:
    enabled: true
    transition: 128
    foundationDepth: 48

# Vanilla river/ocean pass-through for the generic Worldz preset's own
# single_biome/chaos layout modes below (the dedicated singleBiome:/
# chaosBiomes: typed presets have their own copies of these two settings
# instead). Default: both false. See singleBiome: below for what they do.
naturalBiomes:
  rivers: false
  oceans: false

# Optional square border centered at 0,0. Radius is center-to-side distance;
# resizeDelayDays waits at the initial radius. End portal is reachable by
# the final size when enabled.
overworldBorder:
  enabled: false
  initialRadiusBlocks: 512
  finalRadiusBlocks: 512
  resizeDays: 0
  resizeDelayDays: 0
  resizeRateBlocks: 0
  resizeRateDays: 0
  ensureEndPortal: true

# Optional independent Nether border; resizeDelayDays waits at the initial
# radius. Blaze access is reachable by the final size when enabled.
netherBorder:
  enabled: false
  initialRadiusBlocks: 512
  finalRadiusBlocks: 512
  resizeDays: 0
  resizeDelayDays: 0
  resizeRateBlocks: 0
  resizeRateDays: 0
  ensureBlazeAccess: true

# Option to carry the Overworld's eventual (final) border radius into the
# End (GOALS 17), clamped up to minimumRadiusBlocks so the dragon fight
# stays winnable even at very small Overworld sizes. Only takes effect
# when the Overworld border above is enabled; the End otherwise stays
# completely vanilla and unbordered.
endBorder:
  carryFromOverworld: false
  minimumRadiusBlocks: 256

# Terrain beyond a central square: normal, ocean, or void. Boundary 0
# derives from an enabled border.
overworldExterior:
  mode: normal
  boundaryRadiusBlocks: 0
  oceanTransitionWidthBlocks: 128

# Nether terrain beyond a central square: normal or void. Boundary 0
# derives from an enabled border.
netherExterior:
  mode: normal
  boundaryRadiusBlocks: 0
  oceanTransitionWidthBlocks: 128

# Coordinated terrain layout: mode (legacy/ocean/single_biome/void/chaos),
# weighted biomes list (id or id@weight, roles resolved via maintained
# defaults plus roleOverrides), regionScale, singleBiome. Default:
# legacy (today's climate-filter-only behavior).
layout:
  mode: legacy
  biomes: []
  regionScale: 512
  singleBiome: ''
  roleOverrides: {}

# How the layout origin and initial spawn are chosen: strategy is
# starter_at_origin (default, today's behavior), preferred_natural_biome
# (search near the origin for starter.biome using the real seed, moving the
# layout origin there; falls back to starter_at_origin if not found or
# starter.biome is empty), or vanilla_spawn (unmodified vanilla spawn
# selection).
spawn:
  strategy: starter_at_origin

# Defaults for the jlt_worldz:single_biome typed preset (its own small
# Customize screen, separate from the fields above). biome fills the whole
# world; starter.biome empty means no forced zone (same as biome everywhere
# already, via layout mode single_biome); starter.radius only matters when
# starter.biome is set; spawn.strategy accepts the same values as the
# shared spawn section above (preferred_natural_biome searches for
# starter.biome using the real seed). naturalBiomes.rivers/.oceans/.beaches
# let vanilla's own river/ocean/beach biomes generate naturally wherever
# vanilla would place one, instead of the single biome applying everywhere;
# oceans is additive over rivers (both stay on together), independent of
# beaches. Terrain is untouched either way -- coastlines/channels are
# exactly vanilla's, outside the guaranteed-land starter zone.
singleBiome:
  biome: 'minecraft:plains'
  starter:
    biome: ''
    radius: 256
  spawn:
    strategy: starter_at_origin
  naturalBiomes:
    rivers: false
    oceans: false
    beaches: false

# Defaults for the jlt_worldz:chaos_biomes typed preset (GOALS 33; its own
# small Customize screen). biomes is a weighted list (id or id@weight) of
# land biomes shuffled per region -- deserts beside ice spikes beside
# jungles; regionScale controls how big each region is (smaller means
# more frequent biome changes). starter.biome empty means chaos starts
# right at spawn; setting one gives a safe, guaranteed-land starting patch
# like singleBiome's. Terrain is always exactly vanilla -- this only ever
# changes biome identity, never height. naturalBiomes.rivers/.oceans/
# .beaches work exactly like singleBiome's.
chaosBiomes:
  biomes:
    - 'minecraft:desert'
    - 'minecraft:jungle'
    - 'minecraft:ice_spikes'
    - 'minecraft:badlands'
    - 'minecraft:taiga'
  regionScale: 512
  starter:
    biome: ''
    radius: 256
  spawn:
    strategy: starter_at_origin
  naturalBiomes:
    rivers: false
    oceans: false
    beaches: false

# World-hazard "forever night" module (GOAL 30, DESIGN §35.1) -- a shared
# runtime rule, not a typed preset, composable with any world type.
# lockAfterDays: 0 locks night immediately at world creation; a positive
# value keeps normal day/night until that many in-game days have passed,
# then locks. Once locked, vanilla's own sleep-skip logic already refuses
# to advance time (verified against the real 26.2 source), so sleeping
# cannot un-lock it. relaxInsomnia: false keeps vanilla phantom rules
# (sleeping still resets a player's own insomnia timer even though it
# won't skip time); true actively suppresses phantoms for players who
# don't want to deal with them in a night that never ends. Known
# limitation: locking night also pauses any active overworldBorder resize
# schedule for as long as it stays locked (26.2 ties both to the same
# per-dimension clock) -- see README.
foreverNight:
  enabled: false
  lockAfterDays: 0
  relaxInsomnia: false

# World-hazard "rising lava floor" module (GOAL 29, DESIGN §35.2) -- a
# shared runtime rule, not a typed preset, composable with any world type.
# Overworld only. Holds at startY for delayDays, then rises rateBlocks
# every rateDays until it reaches maxY. Every air or water block at or
# below the current level converts to lava; solid terrain is untouched.
# Already-loaded chunks convert incrementally as the level rises; a chunk
# that loads later (or reloads after a restart) catches up to the current
# level immediately. No special-casing for floating/void-based world
# types -- the rule is uniform everywhere air or water exists.
risingLava:
  enabled: false
  delayDays: 3
  startY: -64
  maxY: 64
  rateBlocks: 1
  rateDays: 1
