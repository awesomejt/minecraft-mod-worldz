allowedBiomes:
  - 'minecraft:desert'
  - 'minecraft:beach'
  - 'minecraft:river'
  - 'minecraft:badlands'
  - 'minecraft:eroded_badlands'
  - 'minecraft:wooded_badlands'
  - 'minecraft:stony_shore'
  - 'minecraft:dripstone_caves'
  - 'minecraft:lush_caves'
  - 'minecraft:deep_dark'
starterBiome: 'minecraft:plains'
starterRadiusBlocks: 256
ensureStarterLand: true
starterLandTransitionBlocks: 128
starterLandFoundationDepthBlocks: 48
overworldBorder:
  enabled: false
  initialRadiusBlocks: 512
  finalRadiusBlocks: 512
  resizeDays: 0
  resizeDelayDays: 0
  resizeRateBlocks: 0
  resizeRateDays: 0
  ensureEndPortal: true
netherBorder:
  enabled: false
  initialRadiusBlocks: 512
  finalRadiusBlocks: 512
  resizeDays: 0
  resizeDelayDays: 0
  resizeRateBlocks: 0
  resizeRateDays: 0
  ensureBlazeAccess: true
overworldExterior:
  mode: normal
  boundaryRadiusBlocks: 0
  oceanTransitionWidthBlocks: 128
netherExterior:
  mode: normal
  boundaryRadiusBlocks: 0
  oceanTransitionWidthBlocks: 128
layout:
  mode: legacy
  biomes: []
  oceanCoverageFraction: 0.35
  regionScaleBlocks: 512
  coastBlendWidthBlocks: 128
  singleBiome: ''
  roleOverrides: {}
_docs:
  allowedBiomes: 'Biome ids and/or #tag ids allowed in newly created Worldz overworlds. Default: a desert/badlands/cave biome mix with a plains starter.'
  starterBiome: 'Biome id forced around origin in newly created worlds. Default: minecraft:plains. Empty disables the starter zone. Tags are not accepted.'
  starterRadiusBlocks: 'Circular starter-zone radius in blocks. Default: 256. Range: 64..4096.'
  ensureStarterLand: 'Raise insufficient natural terrain beneath a selected starter biome. Default: true; no effect without a starter biome.'
  starterLandTransitionBlocks: 'Smooth outward blend from guaranteed starter land to natural terrain. Default: 128. Range: 0..4096.'
  starterLandFoundationDepthBlocks: 'Solid repair depth below the natural ocean floor. Default: 48. Range: 0..384.'
  overworldBorder: 'Optional square border centered at 0,0. Radius is center-to-side distance; resizeDelayDays waits at the initial radius. End portal is reachable by the final size when enabled.'
  netherBorder: 'Optional independent Nether border; resizeDelayDays waits at the initial radius. Blaze access is reachable by the final size when enabled.'
  overworldExterior: 'Terrain beyond a central square: normal, ocean, or void. Boundary 0 derives from an enabled border.'
  netherExterior: 'Nether terrain beyond a central square: normal or void. Boundary 0 derives from an enabled border.'
  layout: 'Coordinated terrain layout: mode (legacy/land_only/mixed/ocean/single_biome/void), weighted biomes list (id or id@weight, roles resolved via maintained defaults plus roleOverrides), oceanCoverageFraction (mixed only), regionScaleBlocks, coastBlendWidthBlocks, singleBiome. Default: legacy (today''s climate-filter-only behavior).'
