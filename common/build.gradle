plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev'
}

neoForge {
	neoFormVersion = neo_form_version
}

configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
	configurations.named(variant) {
		attributes {
			attribute(loaderAttribute, 'common')
		}
	}
}
sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
		configurations.named(variant) {
			attributes {
				attribute(loaderAttribute, 'common')
			}
		}
	}
}

test {
	useJUnitPlatform()
}

tasks.register('updateConfigDocs', JavaExec) {
	group = 'documentation'
	description = 'Regenerates schema-driven configuration tables in README.md.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'media.jlt.minecraft.mods.worldz.config.ConfigDocumentationTool'
	args rootProject.file('README.md').absolutePath
}

dependencies {
	implementation "org.yaml:snakeyaml:${snakeyaml_version}"

	testImplementation platform("org.junit:junit-bom:5.14.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "com.google.code.gson:gson:2.14.0"
	testImplementation "org.slf4j:slf4j-api:2.0.17"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
