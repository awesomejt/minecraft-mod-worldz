plugins {
	id 'multiloader-loader'
	id 'net.fabricmc.fabric-loom'
}

dependencies {
	minecraft("com.mojang:minecraft:${minecraft_version}")
	implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
	implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
	implementation("org.yaml:snakeyaml:${snakeyaml_version}")
	include("org.yaml:snakeyaml:${snakeyaml_version}")
}

loom {
	runs {
		client {
			client()
			setConfigName('Fabric Client')
			ideConfigGenerated(true)
			runDir('runs/client')
		}
		server {
			server()
			setConfigName('Fabric Server')
			ideConfigGenerated(true)
			runDir('runs/server')
		}
		gametest {
			inherit server
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/junit.xml"
			runDir "runs/gametest"
		}
	}
}

tasks.register('deployToPrism') {
	group = 'worldz'
	description = "Copies the built Fabric jar into a Prism Launcher instance's mods folder for fast manual " +
		"testing, replacing any older jlt_worldz jar there. Configure the instance path via 'prism.instance.dir' " +
		"in a git-ignored local.properties at the repo root, or pass -PprismInstanceDir=<path>."
	dependsOn(tasks.named('jar'))

	doLast {
		def instanceDir = project.findProperty('prismInstanceDir')
		if (instanceDir == null) {
			def localFile = rootProject.file('local.properties')
			if (localFile.exists()) {
				def localProps = new Properties()
				localFile.withInputStream { localProps.load(it) }
				instanceDir = localProps.getProperty('prism.instance.dir')
			}
		}
		if (instanceDir == null) {
			throw new GradleException(
				"No Prism instance directory configured. Set 'prism.instance.dir' in a git-ignored " +
					"local.properties at the repo root, or pass -PprismInstanceDir=<path>."
			)
		}

		def modsDir = new File(instanceDir as String, 'minecraft/mods')
		if (!modsDir.isDirectory()) {
			modsDir = new File(instanceDir as String, '.minecraft/mods')
		}
		if (!modsDir.isDirectory()) {
			throw new GradleException("Could not find a mods folder under ${instanceDir} (tried minecraft/mods and .minecraft/mods).")
		}

		modsDir.listFiles({ dir, name -> name.startsWith("${mod_id}-fabric-") && name.endsWith('.jar') } as FilenameFilter)
			?.each { it.delete() }

		def builtJar = tasks.named('jar').get().archiveFile.get().asFile
		def target = new File(modsDir, builtJar.name)
		target.bytes = builtJar.bytes
		logger.lifecycle("Deployed ${builtJar.name} to ${target}")
	}
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
	configurations.named(variant) {
		attributes {
			attribute(loaderAttribute, 'fabric')
		}
	}
}
sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
		configurations.named(variant) {
			attributes {
				attribute(loaderAttribute, 'fabric')
			}
		}
	}
}
